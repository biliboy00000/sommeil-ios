# Projet Xcode de Ciné, transformé en Cine.xcodeproj par XcodeGen (sur le Mac de GitHub).
name: Cine
options:
  bundleIdPrefix: com.cine
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  FilmCore:
    path: Packages/FilmCore

targets:
  Cine:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: FilmCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cine.pellicule
        PRODUCT_NAME: Cine
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
        CODE_SIGN_STYLE: Manual
        # Noyaux Core Image écrits en Metal (FilmKernels.metal). « -cikernel » est obsolète pour l'éditeur de liens.
        MTL_COMPILER_FLAGS: "-fcikernel"
        MTLLINKER_FLAGS: "-fcikernel"
        SWIFT_OBJC_BRIDGING_HEADER: App/Sources/Cine-Bridging-Header.h
    info:
      path: App/Info.plist
      properties:
        # Sans accent ici : SideStore donne ce nom à l'identifiant d'app chez Apple, qui refuse les accents.
        # Le nom affiché sur l'écran d'accueil (« Ciné ») vient de fr.lproj et en.lproj/InfoPlist.strings.
        CFBundleDisplayName: Cine
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        NSCameraUsageDescription: >-
          Ciné utilise l'appareil photo pour prendre des photos avec un rendu pellicule cinéma.
        NSPhotoLibraryAddUsageDescription: >-
          Ciné enregistre tes photos et tes vidéos dans l'app Photos.
        NSMicrophoneUsageDescription: >-
          Le micro enregistre le son de tes vidéos.
        NSLocationWhenInUseUsageDescription: >-
          Si tu actives l'option « Lieu », Ciné ajoute l'endroit de la prise de vue à tes photos et vidéos.
        # Le journal (journal.txt) et les dernières photos apparaissent dans l'app Fichiers (« Sur mon iPhone › Ciné »).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false

schemes:
  Cine:
    build:
      targets:
        Cine: all
    run:
      config: Debug
    archive:
      config: Release
