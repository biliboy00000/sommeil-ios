# Description du projet Xcode, transformée en Sommeil.xcodeproj par XcodeGen
# (sur le Mac de GitHub, à chaque compilation). Pas besoin de Mac chez soi.
name: Sommeil
options:
  bundleIdPrefix: com.suivisommeil
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  SleepCore:
    path: Packages/SleepCore

targets:
  Sommeil:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: SleepCore
      # Barre de 0 à 2 h dans la notification « Démarrer la nuit ? » (appui long).
      - target: SommeilNotification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suivisommeil.enregistreur
        PRODUCT_NAME: Sommeil
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
        CODE_SIGN_STYLE: Manual
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Sommeil
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        # Mode d'arrière-plan « audio » : l'enregistrement du micro garde l'app active écran verrouillé.
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: >-
          Le micro enregistre les bruits de la nuit (respiration, ronflements). Le son reste sur ton iPhone.
          Il permet aussi à l'app de continuer à enregistrer écran verrouillé.
        NSMotionUsageDescription: >-
          Les capteurs de mouvement mesurent les battements du cœur (aussi en direct), la respiration,
          la position et les mouvements.
        # Les séances apparaissent dans l'app Fichiers (« Sur mon iPhone › Sommeil »).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false

  # Extension de notification : ce qu'affiche « Démarrer la nuit ? » quand on appuie longuement dessus.
  SommeilNotification:
    type: app-extension
    platform: iOS
    sources:
      - path: App/NotificationExtension
    dependencies:
      - package: SleepCore
      - sdk: UserNotifications.framework
      - sdk: UserNotificationsUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suivisommeil.enregistreur.notification
        PRODUCT_NAME: SommeilNotification
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        SKIP_INSTALL: YES
    info:
      path: App/SommeilNotification-Info.plist
      properties:
        CFBundleDisplayName: Sommeil
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: DEBUT_NUIT
            UNNotificationExtensionInitialContentSizeRatio: 0.5
            UNNotificationExtensionDefaultContentHidden: true
            UNNotificationExtensionUserInteractionEnabled: true

schemes:
  Sommeil:
    build:
      targets:
        Sommeil: all
    run:
      config: Debug
    archive:
      config: Release
