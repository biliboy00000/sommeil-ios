# Vérification de Sommeil sur un Mac de GitHub, à chaque modification.
# 1. Tests du cœur (SleepCore).
# 2. Compilation de l'app Sommeil seule pour iPhone, sans signature (vérification seulement).
# Sommeil est publié dans l'app Gadget (.github/workflows/gadget.yml), avec Ciné, Sonar et Télécommande.
# L'app Sommeil seule reste dans la source SideStore à sa dernière version (0.4.26), et sa dernière
# version publiée reste la « latest » du dépôt : c'est elle qui porte la source (source.json).
# Le fichier Sommeil.ipa reste téléchargeable dans les « artifacts » de chaque compilation.
# Le navigateur Toile a sa propre compilation : .github/workflows/toile.yml.
name: Compilation

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Cine/**'
      - '.github/workflows/cine.yml'
      - 'Sonar/**'
      - '.github/workflows/sonar.yml'
      - 'Gadget/**'
      - 'Telecommande/**'
      - 'Shared/**'
      - '.github/workflows/gadget.yml'
      - 'Toile/**'
      - '.github/workflows/toile.yml'
      - '.github/workflows/filtres.yml'
  pull_request:
    paths-ignore:
      - 'Cine/**'
      - '.github/workflows/cine.yml'
      - 'Sonar/**'
      - '.github/workflows/sonar.yml'
      - 'Gadget/**'
      - 'Telecommande/**'
      - 'Shared/**'
      - '.github/workflows/gadget.yml'
      - 'Toile/**'
      - '.github/workflows/toile.yml'
      - '.github/workflows/filtres.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compilation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests du cœur
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Version de Xcode
        run: xcodebuild -version
      - name: Tests unitaires de SleepCore
        run: swift test --package-path Packages/SleepCore
      - name: Simulateur de séance
        run: swift build -c release --package-path Packages/SleepCore --product SessionSimulator
      - name: Graphiques du rapport (aucune valeur sans couleur)
        run: |
          swiftc -parse-as-library App/Sources/ChartPalette.swift scripts/verifier_graphiques.swift -o verifier_graphiques
          for c in respiration respiration-inconnue positions niveaux-v2 niveaux-v1 niveaux-vides; do
            ./verifier_graphiques "$c"
          done
      - name: Lecture du format en Python (scripts de référence, sur une séance simulée)
        run: |
          python3 -m venv .venv-tests
          .venv-tests/bin/pip install --quiet numpy scipy av soundfile soxr
          SIMULATEUR="$PWD/Packages/SleepCore/.build/release/SessionSimulator" \
            .venv-tests/bin/python -m unittest discover -s reference/pc/tests -v

  app:
    name: App iPhone
    runs-on: macos-26
    needs: tests
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Installer XcodeGen
        run: brew install xcodegen
      - name: Générer le projet Xcode
        run: xcodegen generate
      - name: Compiler pour iPhone (non signé)
        run: |
          xcodebuild -project Sommeil.xcodeproj -scheme Sommeil -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION=0.4.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || {
              echo "::group::Erreurs de compilation"
              grep -E "error:" build.log | sort -u | head -80
              echo "::endgroup::"
              tail -60 build.log
              exit 1
            }
          echo "Avertissements : $(grep -cE ' warning:' build.log || true)"
          grep -E " warning:" build.log | grep -v "/SourcePackages/" | sort -u | head -40 || true
      - name: Fabriquer le fichier .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Sommeil.app Payload/
          # L'extension de notification (barre de 0 à 2 h) doit être dans l'app.
          test -f Payload/Sommeil.app/PlugIns/SommeilNotification.appex/Info.plist
          plutil -p Payload/Sommeil.app/PlugIns/SommeilNotification.appex/Info.plist | grep -E "CFBundleIdentifier|UNNotification|NSExtensionPrincipalClass"
          zip -qry Sommeil.ipa Payload
          ls -lh Sommeil.ipa
      - name: Garder le journal de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-compilation
          path: build.log
          if-no-files-found: ignore
      - name: Garder l'app
        uses: actions/upload-artifact@v4
        with:
          name: Sommeil-ipa
          path: Sommeil.ipa
