# Compilation de Sonar (scanner une pièce avec le son) sur un Mac de GitHub.
# 1. Test de l'analyse Python sur un scan simulé.
# 2. Compilation de l'app pour iPhone, sans signature (SideStore signe avec ton identifiant Apple).
# 3. Publication de Sonar.ipa (version « sonar-v0.1.N », pas marquée comme la dernière : le lien
#    « latest » reste celui de Sommeil) et ajout de Sonar dans la source SideStore commune.
name: Sonar

on:
  push:
    branches: [main]
    paths:
      - 'Sonar/**'
      - '.github/workflows/sonar.yml'
  pull_request:
    paths:
      - 'Sonar/**'
      - '.github/workflows/sonar.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: Analyse (simulation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: pip install numpy scipy matplotlib
      - name: Scan simulé → les 4 murs doivent être retrouvés à 5 cm près
        working-directory: Sonar
        run: |
          python3 analyse/simuler_scan.py /tmp/sim --mode balayage
          python3 analyse/analyser_scan.py /tmp/sim --sortie /tmp/sim_out --voxel 0.1 > /tmp/rapport.json
          python3 - <<'PY'
          import json, numpy as np
          r = json.load(open("/tmp/rapport.json"))
          attendus = [((1, 0, 0), 2.2), ((-1, 0, 0), 2.0), ((0, 0, 1), 1.5), ((0, 0, -1), 2.5)]
          for n, c in attendus:
              ok = any(np.dot(p["normale"], n) > 0.98 and abs(float(p["equation"].split("=")[1]) - c) < 0.05 for p in r["plans"])
              print(n, c, "OK" if ok else "MANQUANT")
              assert ok
          PY

  app:
    name: App iPhone (Sonar)
    runs-on: macos-26
    timeout-minutes: 40
    # Une seule publication à la fois (Sommeil, Ciné ou Sonar) : la source SideStore est commune.
    concurrency:
      group: publication-sidestore
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Installer XcodeGen
        run: brew install xcodegen
      - name: Générer le projet Xcode
        working-directory: Sonar
        run: xcodegen generate
      - name: Compiler pour iPhone (non signé)
        run: |
          xcodebuild -project Sonar/Sonar.xcodeproj -scheme Sonar -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-sonar \
            MARKETING_VERSION=0.1.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build-sonar.log 2>&1 || {
              echo "::group::Erreurs de compilation"
              grep -E "error:" build-sonar.log | sort -u | head -80
              echo "::endgroup::"
              tail -60 build-sonar.log
              exit 1
            }
          echo "Avertissements : $(grep -cE ' warning:' build-sonar.log || true)"
          grep -E " warning:" build-sonar.log | sort -u | head -40 || true
      - name: Fabriquer le fichier .ipa
        run: |
          mkdir -p Payload
          cp -R build-sonar/Build/Products/Release-iphoneos/Sonar.app Payload/
          plutil -p Payload/Sonar.app/Info.plist | grep -E "CFBundleIdentifier|CFBundleDisplayName|UsageDescription"
          plutil -extract CFBundleDisplayName raw Payload/Sonar.app/Info.plist | LC_ALL=C grep -qE '^[A-Za-z0-9 ]+$'
          zip -qry Sonar.ipa Payload
          ls -lh Sonar.ipa
      - name: Garder le journal de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-compilation-sonar
          path: build-sonar.log
          if-no-files-found: ignore
      - name: Garder l'app
        uses: actions/upload-artifact@v4
        with:
          name: Sonar-ipa
          path: Sonar.ipa
      - name: Publier la version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sonar-v0.1.${{ github.run_number }}
          name: Sonar 0.1.${{ github.run_number }}
          make_latest: false
          files: Sonar.ipa
          body: |
            Version compilée automatiquement depuis ${{ github.sha }}.
            À installer avec SideStore, directement sur l'iPhone (même source que Sommeil et Ciné) : voir Sonar/README.md.
      - name: Ajouter Sonar à la source SideStore
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DERNIERE=$(scripts/source_actuelle.sh base.json)
          echo "Source mise à jour dans la version $DERNIERE"
          scripts/completer_source.sh base.json
          # Sommeil doit rester dans la source : sinon on ne publie rien.
          python3 scripts/source_sidestore.py Payload/Sonar.app Sonar.ipa "sonar-v0.1.${{ github.run_number }}" source.json \
            --base base.json --exiger com.suivisommeil.enregistreur
          gh release upload "$DERNIERE" source.json --repo "$GITHUB_REPOSITORY" --clobber
