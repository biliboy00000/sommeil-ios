# Compilation de Sonar (scanner une pièce avec le son) sur un Mac de GitHub.
# 1. Test de l'analyse Python sur un scan simulé.
# 2. Compilation de l'app pour iPhone, sans signature (SideStore signe avec ton identifiant Apple).
# Vérification seulement : Sonar est publié dans l'app Gadget (.github/workflows/gadget.yml).
# Le fichier Sonar.ipa reste téléchargeable dans les « artifacts » de chaque compilation.
name: Sonar

on:
  push:
    branches: [main]
    paths:
      - 'Sonar/**'
      - 'Shared/**'
      - '.github/workflows/sonar.yml'
  pull_request:
    paths:
      - 'Sonar/**'
      - 'Shared/**'
      - '.github/workflows/sonar.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: Analyse (simulation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: pip install numpy scipy matplotlib
      - name: Scan simulé → les 4 murs doivent être retrouvés à 5 cm près
        working-directory: Sonar
        run: |
          python3 analyse/simuler_scan.py /tmp/sim --mode balayage
          python3 analyse/analyser_scan.py /tmp/sim --sortie /tmp/sim_out --voxel 0.1 > /tmp/rapport.json
          python3 - <<'PY'
          import json, numpy as np
          r = json.load(open("/tmp/rapport.json"))
          attendus = [((1, 0, 0), 2.2), ((-1, 0, 0), 2.0), ((0, 0, 1), 1.5), ((0, 0, -1), 2.5)]
          for n, c in attendus:
              ok = any(np.dot(p["normale"], n) > 0.98 and abs(float(p["equation"].split("=")[1]) - c) < 0.05 for p in r["plans"])
              print(n, c, "OK" if ok else "MANQUANT")
              assert ok
          PY

  app:
    name: App iPhone (Sonar)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Installer XcodeGen
        run: brew install xcodegen
      - name: Générer le projet Xcode
        working-directory: Sonar
        run: xcodegen generate
      - name: Compiler pour iPhone (non signé)
        run: |
          xcodebuild -project Sonar/Sonar.xcodeproj -scheme Sonar -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-sonar \
            MARKETING_VERSION=0.1.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build-sonar.log 2>&1 || {
              echo "::group::Erreurs de compilation"
              grep -E "error:" build-sonar.log | sort -u | head -80
              echo "::endgroup::"
              tail -60 build-sonar.log
              exit 1
            }
          echo "Avertissements : $(grep -cE ' warning:' build-sonar.log || true)"
          grep -E " warning:" build-sonar.log | sort -u | head -40 || true
      - name: Fabriquer le fichier .ipa
        run: |
          mkdir -p Payload
          cp -R build-sonar/Build/Products/Release-iphoneos/Sonar.app Payload/
          plutil -p Payload/Sonar.app/Info.plist | grep -E "CFBundleIdentifier|CFBundleDisplayName|UsageDescription"
          plutil -extract CFBundleDisplayName raw Payload/Sonar.app/Info.plist | LC_ALL=C grep -qE '^[A-Za-z0-9 ]+$'
          zip -qry Sonar.ipa Payload
          ls -lh Sonar.ipa
      - name: Garder le journal de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-compilation-sonar
          path: build-sonar.log
          if-no-files-found: ignore
      - name: Garder l'app
        uses: actions/upload-artifact@v4
        with:
          name: Sonar-ipa
          path: Sonar.ipa
