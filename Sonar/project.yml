# Projet Xcode de Sonar, transformé en Sonar.xcodeproj par XcodeGen (sur le Mac de GitHub).
name: Sonar
options:
  bundleIdPrefix: com.sonar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Sonar:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sonar.scan
        PRODUCT_NAME: Sonar
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
        CODE_SIGN_STYLE: Manual
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Sonar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIRequiredDeviceCapabilities:
          - arkit
        NSMicrophoneUsageDescription: >-
          Sonar écoute les échos des sons qu'il émet pour cartographier la pièce.
        NSCameraUsageDescription: >-
          La caméra sert uniquement à suivre la position du téléphone pendant le scan.
        # Les scans apparaissent aussi dans l'app Fichiers (« Sur mon iPhone › Sonar »).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false

schemes:
  Sonar:
    build:
      targets:
        Sonar: all
    run:
      config: Debug
    archive:
      config: Release
